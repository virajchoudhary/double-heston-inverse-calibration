schema_version: "1.0"
status: PREPARED_NOT_EXECUTED

readiness:
  core_dataset_ready: true
  core_dataset_ready_meaning: ready_to_generate_not_already_generated
  core_generation_plan_ready: true
  core_dataset_generated: false
  challenge_stress_ready: false
