metrics:
  mask_support_disclosure:
    report_per_surface_usable_count: true
    report_by_expiry_rank_and_option_type: true
    distribution_shift_warning: >
      Model 1 and Model 2 were trained on complete synthetic masks. Real G8
      surfaces use the observed partial mask. Report support explicitly and do
      not interpret G8 as ordinary in-distribution generalization.
  pricing_errors:
    normalized_price_rmse: true
    normalized_price_mae: true
    normalized_price_max_absolute_error: true
    dollar_price_rmse: true
    dollar_price_mae: true
    relative_price_error_mean: true
    percentiles: [median, p95]
    subsets: [pricing_family_calibration, pricing_family_holdout, inverse_full_valid_r2]
  implied_volatility_errors:
    market_iv_source: robust_bracketed_forward_black_solution
    model_iv_rule: invert_each_model_or_repriced_price_with_same_bracketed_routine
    annualized_rmse: true
    annualized_mae: true
    annualized_bias: true
    annualized_max_absolute_error: true
    success_rate_and_failure_reasons: true
    clipping_or_replacement_allowed: false
  stability:
    traditional_cross_start_range_scaled_std_per_parameter: true
    traditional_complete_linkage_cluster_cutoff: 0.10
    traditional_disagreement_any_pair_gt_range_scaled_distance: 0.50
    material_parameter_displacement_rmse_threshold: 0.05
    boundary_near_fraction_threshold: 0.02
    neural_cross_seed_parameter_dispersion: true
    neural_cross_seed_headline_metric_std: true
    constraint_validity_rate: true
    per_constraint_violation_rates: true
    optimizer_success_cap_and_exception_rates: true
    iv_inversion_failure_rate: true
  runtime:
    wall_seconds_per_surface_by_model: true
    total_wall_seconds_by_model: true
    neural_batched_eval_mode_no_grad_cpu_ms_per_surface: true
    traditional_seconds_include_all_starts: true
    hardware_python_library_versions_recorded: true

failure_reporting:
  atomic_evidence_bundle_required: true
  manifest_sha256_for_every_input_output_and_report: true
  retain_failed_starts_predictions_and_iv_failures: true
  no_silent_rerun_with_changed_settings: true
  archive_hash_or_schema_mismatch_behavior: ABORT_BEFORE_MODEL_EXECUTION
  selection_failure_behavior: RECORD_AND_CONTINUE_SCAN_UNTIL_RULE_RESOLVES
  evaluation_failure_behavior: REPORT_METHOD_SURFACE_FAILURE_AND_DO_NOT_IMPUTE

interpretation_criteria:
  primary_outputs: predeclared_tables_and_json_not_narrative_selection
  family_classification_default: NO_CLEAR_PRICING_FAMILY_WINNER
  inverse_real_truth_classification: NO_REAL_PARAMETER_TRUTH_WINNER
  practical_non_identifiability: RETAINED_RESEARCH_FINDING
  separate_conceptual_comparisons_required: true
  forbidden_post_hoc_actions:
    - change thresholds seeds starts budgets or masks after any G8 result
    - tune architectures hyperparameters loss weights or checkpoints on G8
    - train or fine-tune neural weights on G8
    - select a seed start date or symbol from model outcomes
    - relabel the NTPC 2026-07-15 pilot as final evaluation
    - claim Double Heston or Model3 superiority without the frozen joint rule

data_blocker:
  status: BLOCKED_PENDING_PROTOCOL_COMPLIANT_ACQUISITION
  reason: >
    The repository contains provenance only for development July 2026 NSE/RBI
    observations and synthetic R2 research data. No tracked or documented G8
    archive establishes untouched post-2026-09-30 observations for the eligible
    universe, so none may be invented or acquired during this protocol freeze.
  acquisition_requirements:
    execute_only_after_all_participating_inverse_methods_are_frozen: true
    acquire_official_udiff_cm_and_fo_for_each_scanned_candidate_date: true
    preserve_official_urls_and_utc_retrieval_times: true
    preserve_zip_and_extracted_csv_sha256_hashes: true
    validate_zip_members_encoding_delimiters_and_trading_dates: true
    preserve_latest_prior_rbi_91_day_auction_artifact_and_normalized_extract: true
    compare_candidate_contract_keys_against_development_registry_fail_closed: true
    write_support_counts_masks_and_rejection_reasons_but_no_model_outcome: true
    hash_freeze_data_manifest_before_any_evaluation_command: true
