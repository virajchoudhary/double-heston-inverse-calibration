project:
  name: ordinary_ann_double_heston_inverse_calibration
  stage: infrastructure_test
  seed: 42

data:
  representation: normalized_price
  include_calls: true
  include_puts: true

  log_moneyness_grid:
    - -0.30
    - -0.20
    - -0.10
    - -0.05
    - 0.00
    - 0.05
    - 0.10
    - 0.20
    - 0.30

  maturity_days:
    - 7
    - 14
    - 30
    - 60
    - 90
    - 180

  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15

model:
  hidden_sizes:
    - 512
    - 256
    - 128
    - 64
  activation: relu
  dropout: 0.10
  output_size: 10

training:
  batch_size: 256
  epochs: 200
  learning_rate: 0.001
  weight_decay: 0.00001
  patience: 20

evaluation:
  noise_levels:
    - 0.00
    - 0.005
    - 0.01
    - 0.02

  repeated_seeds:
    - 11
    - 22
    - 33
    - 44
    - 55
